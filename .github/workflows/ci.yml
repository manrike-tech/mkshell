name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev zsh fish

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Frontend (tipos, tests, build)
        run: |
          pnpm --filter mkshell-desktop check
          pnpm --filter mkshell-desktop test
          pnpm --filter mkshell-desktop build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Prueba de concepto de la fase 1: integración OSC 133 a través del PTY real.
      - name: mksh-probe (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo run -q -p mksh-probe -- --shell bash
          cargo run -q -p mksh-probe -- --shell zsh
          cargo run -q -p mksh-probe -- --shell fish
      - name: mksh-probe (Windows, ConPTY)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -q -p mksh-probe -- --list
          cargo run -q -p mksh-probe -- --shell pwsh --json
          cargo run -q -p mksh-probe -- --shell powershell --json
          cargo run -q -p mksh-probe -- --shell cmd --json
