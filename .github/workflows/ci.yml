name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint separado de las pruebas: un aviso nuevo de clippy no oculta los
  # resultados de las pruebas (sobre todo las de Windows).
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend (tipos y build)
        run: |
          pnpm --filter mkshell-desktop check
          pnpm --filter mkshell-desktop build
      - run: cargo fmt --all -- --check
      # --keep-going: lista los avisos de todos los crates que compilan, no solo del primero.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev zsh fish

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Frontend (tests y build)
        run: |
          pnpm --filter mkshell-desktop test
          pnpm --filter mkshell-desktop build

      - run: cargo test --workspace --no-fail-fast

      # Prueba de concepto de la fase 1: integración OSC 133 a través del PTY real.
      - name: mksh-probe (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo run -q -p mksh-probe -- --shell bash
          cargo run -q -p mksh-probe -- --shell zsh
          cargo run -q -p mksh-probe -- --shell fish
      - name: mksh-probe (Windows, ConPTY)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -q -p mksh-probe -- --list
          $failed = 0
          foreach ($shell in @('pwsh', 'windows-powershell', 'cmd')) {
            Write-Host "::group::mksh-probe $shell"
            cargo run -q -p mksh-probe -- --shell $shell --dump
            if ($LASTEXITCODE -ne 0) { $failed++ }
            Write-Host "::endgroup::"
          }
          exit $failed
